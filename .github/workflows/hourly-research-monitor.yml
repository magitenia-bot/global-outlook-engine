name: Global Outlook incremental research monitor
on:
  push:
    branches: [main]
    paths:
      - 'research_monitor.py'
  schedule:
    - cron: '17 * * * *'
    - cron: '10 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'hourly or daily'
        required: false
        default: hourly
        type: choice
        options: [hourly, daily]
permissions:
  contents: write
concurrency:
  group: global-outlook-research-monitor
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '10 3 * * *' && 'daily' || 'hourly') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate monitor syntax
        run: python -m py_compile research_monitor.py
      - name: Monitor public sources and discover outlook candidates
        run: python research_monitor.py
      - name: Commit evidence log and state only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_monitor/
          if ! git diff --cached --quiet; then
            git commit -m "research: update public-source monitoring results"
            git push
          fi
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-monitor-${{ github.run_id }}
          path: research_monitor/last_run.json
          if-no-files-found: ignore
          retention-days: 14
