name: Global Outlook 3.1 - Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: global-outlook-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run acquisition
        run: python acquire.py --dir .

      - name: Discover official outlook documents
        run: python discover.py --dir .

      - name: Verify candidate documents
        run: python verify_documents_v2.py --dir .

      - name: Select recent outlooks
        run: python select_outlooks_v2.py --dir .

      - name: Commit monitoring and research data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sources.csv acquisition_events.csv document_candidates.csv discovery_checks.csv document_verification.csv outlook_selection.csv outlook_weekly_candidates.csv outlook_monthly_candidates.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update Global Outlook research and selection data"
            git push origin HEAD:main
          else
            echo "No research data changes to commit"
          fi

      - name: Save research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-outlook-results
          path: |
            sources.csv
            acquisition_events.csv
            document_candidates.csv
            discovery_checks.csv
            document_verification.csv
            outlook_selection.csv
            outlook_weekly_candidates.csv
            outlook_monthly_candidates.csv
          if-no-files-found: warn
          retention-days: 30
