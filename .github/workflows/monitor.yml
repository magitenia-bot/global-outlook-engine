name: Global Outlook 3.1 - Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: global-outlook-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run acquisition
        run: python acquire.py --dir .

      - name: Discover official outlook documents
        run: python discover.py --dir .

      - name: Commit monitoring and discovery data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.csv acquisition_events.csv document_candidates.csv discovery_checks.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Global Outlook monitoring and discovery data"
            git push origin HEAD:main
          else
            echo "No monitoring or discovery changes to commit"
          fi

      - name: Save monitoring and discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-outlook-results
          path: |
            sources.csv
            acquisition_events.csv
            document_candidates.csv
            discovery_checks.csv
          if-no-files-found: warn
          retention-days: 30
