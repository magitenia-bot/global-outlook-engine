name: Global Outlook - Source Extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor.yml'
      - 'test_*.py'
      - 'acquire.py'
      - 'snapshot_sources.py'
      - 'discover.py'
      - 'verify_documents_v2.py'
      - 'select_outlooks_v21.py'
      - 'extract_views.py'
      - 'document_content.py'
      - 'collect_document_evidence.py'
      - 'analyze_evidence.py'
      - 'propose_stances.py'
      - 'sources.csv'
  schedule:
    - cron: '0 4,5 * * *'

permissions:
  contents: write

concurrency:
  group: global-outlook-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Only one of the two UTC slots corresponds to 06:00 Europe/Rome; ChatGPT interprets later.
    if: github.event_name != 'schedule' || (github.event.schedule == '0 4,5 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Italy local execution hour
        id: italy_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          local = dt.datetime.now(ZoneInfo('Europe/Rome'))
          allowed = os.environ.get('EVENT_NAME') != 'schedule' or local.hour == 6
          print('run_pipeline=' + ('true' if allowed else 'false'))
          print('italy_time=' + local.isoformat())
          PY

      - name: Checkout repository
        if: steps.italy_time.outputs.run_pipeline == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        if: steps.italy_time.outputs.run_pipeline == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF text reader
        if: steps.italy_time.outputs.run_pipeline == 'true'
        run: python -m pip install 'pypdf==6.1.3'

      - name: Test dashboard consensus safeguards
        if: steps.italy_time.outputs.run_pipeline == 'true'
        run: python -m unittest -v test_build_report.py test_extract_views.py test_collect_document_evidence.py test_document_pipeline.py test_document_content.py test_propose_stances.py

      - name: Run acquisition
        if: steps.italy_time.outputs.run_pipeline == 'true'
        run: python acquire.py --dir .

      - name: Discover candidate outlook links (not verified)
        if: steps.italy_time.outputs.run_pipeline == 'true'
        run: python discover.py --dir .

      # Document verification, source interpretation and stance assignment are
      # performed by ChatGPT during explicit research sessions, not GitHub Actions.
      # GitHub stores candidate links, verified research records and historical snapshots.

      - name: Generate source-only snapshot for ChatGPT interpretation
        if: steps.italy_time.outputs.run_pipeline == 'true'
        run: python snapshot_sources.py --dir .

      - name: Commit monitoring and research data
        if: steps.italy_time.outputs.run_pipeline == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- sources.csv acquisition_events.csv document_candidates.csv discovery_checks.csv research_snapshot.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Global Outlook raw source discovery database"
            git push origin HEAD:main
          else
            echo "No research data changes to commit"
          fi

      - name: Archive research database and report
        if: steps.italy_time.outputs.run_pipeline == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: global-outlook-results
          path: |
            sources.csv
            outlook_source_registry.csv
            validated_views.csv
            acquisition_events.csv
            document_candidates.csv
            discovery_checks.csv
            document_verification.csv
            outlook_selection.csv
            outlook_weekly_candidates.csv
            outlook_monthly_candidates.csv
            outlook_quarterly_candidates.csv
            outlook_strategic_candidates.csv
            outlook_unclassified_candidates.csv
            view_review_queue.csv
            document_evidence.csv
            document_topic_evidence.csv
            stance_proposals.csv
            research_snapshot.json
            global_outlook.html
            report_status.json
          if-no-files-found: warn
          retention-days: 30
