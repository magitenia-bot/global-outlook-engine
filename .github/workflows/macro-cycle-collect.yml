name: Global Macro Cycle - Official Yield Curves
on:
  schedule:
    - cron: '19 4,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macro-cycle-source-collector
  cancel-in-progress: false
jobs:
  macro-curves:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Validate Rome local hour 06
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          local=datetime.now(ZoneInfo("Europe/Rome"))
          allowed=os.getenv("EVENT_NAME") != "schedule" or local.hour == 6
          print("run=" + str(allowed).lower())
          print("local_time=" + local.isoformat())
          PY
      - name: Checkout repository
        if: steps.time.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Setup Python
        if: steps.time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parsers offline
        if: steps.time.outputs.run == 'true'
        run: python -m unittest -v macro_cycle/test_ingest_yield_curves.py
      - name: Acquire official yield curve data
        if: steps.time.outputs.run == 'true'
        run: python macro_cycle/ingest_yield_curves.py
      - name: Commit only macro source data
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- macro_cycle/data/yield_curves.csv macro_cycle/data/ingestion_status.json
          if ! git diff --cached --quiet; then
            git commit -m "macro-cycle: refresh sourced yield curves"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new yield curve observations"
          fi
